name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  l0-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/e2e/package-lock.json
      - name: Install
        run: |
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r app/backend/requirements-dev.txt pip-audit
          npm ci --prefix app/frontend
          npm ci --prefix app/e2e
          npx --prefix app/e2e playwright install --with-deps chromium ffmpeg
      - name: L0 gate (backend + frontend + contract + traceability + Playwright E2E)
        run: python tools/ci_local.py --log ci-log.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l0-evidence
          path: |
            ci-log.txt
            app/backend/coverage.xml
            app/frontend/coverage/
            test_reports/
