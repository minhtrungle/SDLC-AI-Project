name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  l0-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r requirements-dev.txt pip-audit
      - name: L0 gate (format, lint, compile, secret scan, dependency audit, cross-view audit, traceability, tests + coverage)
        run: python tools/ci_local.py --log ci-log.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l0-evidence
          path: |
            ci-log.txt
            docs/07-verification/coverage.xml
            docs/07-verification/junit.xml
