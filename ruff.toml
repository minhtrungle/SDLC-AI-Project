# Python lint/format for backend/ and tools/.
line-length = 110
target-version = "py312"
extend-exclude = ["SDLC-Prompt-Checklist", "docs", "app/frontend"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PL"]
ignore = [
    "PLR0913",  # FastAPI handlers take many injected params
    "PLR0917",  # retriever/handler signatures mirror the documented interfaces
    "PLR2004",  # magic numbers are fine in tests and limits
    "S101",     # assert in tests
]

[lint.per-file-ignores]
"app/backend/tests/**" = ["S", "PLR0915", "PLC0415"]
"app/e2e/**" = ["S", "PLC0415"]  # Playwright harness: throwaway accounts, local subprocesses
"tools/**" = ["S", "PLR0915", "PLR0912", "PLR0917", "E501"]

[lint.isort]
known-first-party = ["cwd", "tests"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header"]
