[project]
name = "chat-with-docs"
version = "0.1.0"
description = "Chat với tài liệu — MVP hỏi đáp trên PDF có trích dẫn"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["SDLC-Prompt-Checklist", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PL"]
ignore = [
    "PLR0913",  # FastAPI handlers take many injected params
    "PLR0917",  # retriever/handler signatures mirror the documented interfaces
    "PLR2004",  # magic numbers are fine in tests and limits
    "S101",     # assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0915", "PLC0415"]
"tools/**" = ["S", "PLR0915", "PLR0912", "PLR0917", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml:docs/07-verification/coverage.xml --cov-fail-under=70"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header"]
